name: GenAI RAG System - CI/CD Pipeline

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      run_evaluation:
        description: "Run LLM evaluation pipeline"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      eval_framework:
        description: "Evaluation framework to use"
        required: false
        default: "both"
        type: choice
        options:
          - "deepeval"
          - "ragas"
          - "both"

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ============================================================
  # Job 1: Code Quality
  # ============================================================

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff Lint
        run: ruff check . --output-format=github

      - name: Ruff Format Check
        run: ruff format --check .

      - name: MyPy Type Check
        run: mypy . --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  # ============================================================
  # Job 2: Unit Tests
  # ============================================================

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Create artifacts folder
        run: mkdir -p artifacts

      - name: Run Unit Tests
        env:
          ENVIRONMENT: test
          OPENAI_API_KEY: "test-key"
        run: |
          pytest tests/ -v \
            --tb=short \
            --junitxml=artifacts/test-results.xml \
            --cov=. \
            --cov-report=xml:artifacts/coverage.xml \
            --cov-report=html:artifacts/coverage-html \
            --cov-report=term-missing \
            -k "not integration"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results.xml

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/coverage-html/

  # ============================================================
  # Job 3: Integration Tests
  # ============================================================

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create artifacts folder
        run: mkdir -p artifacts

      - name: Run Integration Tests
        env:
          ENVIRONMENT: integration
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest tests/ -v \
            --tb=short \
            -k "integration" \
            --junitxml=artifacts/integration-results.xml
        continue-on-error: true

      - name: Upload Integration Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: artifacts/integration-results.xml

  # ============================================================
  # Job 4: LLM Evaluation
  # ============================================================

  llm-evaluation:
    name: LLM Evaluation Pipeline
    runs-on: ubuntu-latest
    needs: unit-tests

    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_evaluation == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create artifacts folder
        run: mkdir -p artifacts/evaluation

      - name: Determine Evaluation Framework
        id: eval-config
        run: |
          if [ "${{ github.event.inputs.eval_framework }}" = "" ]; then
            echo "framework=both" >> $GITHUB_OUTPUT
          else
            echo "framework=${{ github.event.inputs.eval_framework }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_MODEL: gpt-4o-mini
          EVAL_THRESHOLD: 0.7
        run: |
          python -m scripts.run_evaluation \
            --framework ${{ steps.eval-config.outputs.framework }} \
            --dataset-path data/evaluation/eval_dataset.json \
            --output-dir artifacts/evaluation

      - name: Upload Evaluation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: artifacts/evaluation/

  # ============================================================
  # Job 5: Build
  # ============================================================

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: unit-tests

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build Package
        run: python -m build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-package
          path: dist/