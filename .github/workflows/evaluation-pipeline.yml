name: LLM Evaluation Pipeline (Scheduled)

on:
  schedule:
    # Run evaluation every Monday at 6 AM UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      eval_framework:
        description: "Evaluation framework"
        required: true
        default: "both"
        type: choice
        options:
          - "deepeval"
          - "ragas"
          - "both"
      threshold:
        description: "Pass threshold (0.0 - 1.0)"
        required: false
        default: "0.7"

env:
  PYTHON_VERSION: "3.11"

jobs:
  scheduled-evaluation:
    name: Scheduled LLM Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluation pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          USE_OPENROUTER: ${{ vars.USE_OPENROUTER || 'false' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-4o-mini' }}
          EVAL_MODEL: ${{ vars.EVAL_MODEL || 'gpt-4o-mini' }}
          EVAL_THRESHOLD: ${{ github.event.inputs.threshold || '0.7' }}
          EVAL_FRAMEWORKS: ${{ github.event.inputs.eval_framework == 'both' && 'deepeval,ragas' || github.event.inputs.eval_framework || 'deepeval,ragas' }}
          EVAL_RUN_RAG_PIPELINE: "true"
          EVAL_RESULTS_PATH: "artifacts/evaluation"
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'true' }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_SENDER_PASSWORD: ${{ secrets.EMAIL_SENDER_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          EMAIL_SMTP_HOST: ${{ vars.EMAIL_SMTP_HOST || 'smtp.gmail.com' }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT || '587' }}
        run: python -m scripts.run_evaluation

      - name: Check thresholds and generate report
        env:
          EVAL_THRESHOLD: ${{ github.event.inputs.threshold || '0.7' }}
          EVAL_RESULTS_PATH: "artifacts/evaluation"
        run: python -m scripts.check_thresholds

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-eval-${{ github.run_number }}
          path: artifacts/evaluation/
          retention-days: 30