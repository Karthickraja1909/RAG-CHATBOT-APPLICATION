name: GenAI RAG System - CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: Code Quality & Linting
  # ═══════════════════════════════════════════════════════════════
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      #     pip install ruff mypy

      # - name: Run Ruff linter
      #   run: ruff check . --output-format=github

      # - name: Run Ruff formatter check
      #   run: ruff format --check .

      # - name: Run type checking (mypy)
      #   run: mypy --ignore-missing-imports --no-strict-optional .
      #   continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # Job 2: Unit Tests
  # ═══════════════════════════════════════════════════════════════
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # - name: Run unit tests with coverage
      #   env:
      #     ENVIRONMENT: test
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test-key-for-ci' }}
      #   run: |
      #     pytest tests/ -v \
      #       --tb=short \
      #       --junitxml=artifacts/test-results.xml \
      #       --cov=. \
      #       --cov-report=xml:artifacts/coverage.xml \
      #       --cov-report=html:artifacts/coverage-html \
      #       --cov-report=term-missing \
      #       -k "not integration"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/coverage-html/

  # ═══════════════════════════════════════════════════════════════
  # Job 3: Integration Tests
  # ═══════════════════════════════════════════════════════════════
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        env:
          ENVIRONMENT: integration
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest tests/ -v \
            --tb=short \
            -k "integration" \
            --junitxml=artifacts/integration-results.xml
        continue-on-error: true

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: artifacts/integration-results.xml

  # ═══════════════════════════════════════════════════════════════
