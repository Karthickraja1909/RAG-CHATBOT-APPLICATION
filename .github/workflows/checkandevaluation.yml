name: GenAI RAG System - CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_evaluation:
        description: "Run LLM evaluation pipeline"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      eval_framework:
        description: "Evaluation framework to use"
        required: false
        default: "both"
        type: choice
        options:
          - "deepeval"
          - "ragas"
          - "both"

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: Code Quality & Linting
  # ═══════════════════════════════════════════════════════════════
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      #     pip install ruff mypy

      # - name: Run Ruff linter
      #   run: ruff check . --output-format=github

      # - name: Run Ruff formatter check
      #   run: ruff format --check .

      # - name: Run type checking (mypy)
      #   run: mypy --ignore-missing-imports --no-strict-optional .
      #   continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # Job 2: Unit Tests
  # ═══════════════════════════════════════════════════════════════
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # - name: Run unit tests with coverage
      #   env:
      #     ENVIRONMENT: test
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test-key-for-ci' }}
      #   run: |
      #     pytest tests/ -v \
      #       --tb=short \
      #       --junitxml=artifacts/test-results.xml \
      #       --cov=. \
      #       --cov-report=xml:artifacts/coverage.xml \
      #       --cov-report=html:artifacts/coverage-html \
      #       --cov-report=term-missing \
      #       -k "not integration"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/coverage-html/

  # ═══════════════════════════════════════════════════════════════
  # Job 3: Integration Tests
  # ═══════════════════════════════════════════════════════════════
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        env:
          ENVIRONMENT: integration
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest tests/ -v \
            --tb=short \
            -k "integration" \
            --junitxml=artifacts/integration-results.xml
        continue-on-error: true

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: artifacts/integration-results.xml

  # ═══════════════════════════════════════════════════════════════
  # Job 4: LLM Evaluation Pipeline
  # ═══════════════════════════════════════════════════════════════
  llm-evaluation:
    name: LLM Evaluation Pipeline
    runs-on: ubuntu-latest
    needs: unit-tests
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine evaluation framework
        id: eval-config
        run: |
          if [ "${{ github.event.inputs.eval_framework }}" = "" ] || [ "${{ github.event.inputs.eval_framework }}" = "both" ]; then
            echo "framework=deepeval,ragas" >> $GITHUB_OUTPUT
          else
            echo "framework=${{ github.event.inputs.eval_framework }}" >> $GITHUB_OUTPUT
          fi

      - name: Run LLM Evaluation
        env:
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          USE_OPENROUTER: ${{ vars.USE_OPENROUTER || 'false' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-4o-mini' }}
          EVAL_MODEL: ${{ vars.EVAL_MODEL || 'gpt-4o-mini' }}
          EVAL_THRESHOLD: ${{ vars.EVAL_THRESHOLD || '0.7' }}
          EVAL_FRAMEWORKS: ${{ steps.eval-config.outputs.framework }}
          EVAL_RUN_RAG_PIPELINE: "true"
          EVAL_CUSTOM_METRICS_ENABLED: ${{ vars.EVAL_CUSTOM_METRICS_ENABLED || 'false' }}
          EVAL_RESULTS_PATH: "artifacts/evaluation"
          DEEPEVAL_METRICS: ${{ vars.DEEPEVAL_METRICS || 'answer_relevancy,faithfulness,contextual_precision,contextual_recall' }}
          RAGAS_METRICS: ${{ vars.RAGAS_METRICS || 'faithfulness,answer_relevancy,context_precision,context_recall' }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'true' }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_SENDER_PASSWORD: ${{ secrets.EMAIL_SENDER_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          EMAIL_SMTP_HOST: ${{ vars.EMAIL_SMTP_HOST || 'smtp.gmail.com' }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT || '587' }}
        run: python -m scripts.run_evaluation

      - name: Check evaluation thresholds
        env:
          EVAL_THRESHOLD: ${{ vars.EVAL_THRESHOLD || '0.7' }}
          EVAL_RESULTS_PATH: "artifacts/evaluation"
        run: python -m scripts.check_thresholds

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: artifacts/evaluation/

      - name: Comment evaluation results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'artifacts/evaluation/summary.json';
            
            if (fs.existsSync(path)) {
              const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
              const body = `## 🔬 LLM Evaluation Results\n\n` +
                `| Metric | Score | Status |\n|--------|-------|--------|\n` +
                Object.entries(summary.metrics || {}).map(([name, data]) => 
                  `| ${name} | ${(data.average_score * 100).toFixed(1)}% | ${data.average_score >= 0.7 ? '✅' : '❌'} |`
                ).join('\n') +
                `\n\n**Overall Pass Rate:** ${(summary.overall_pass_rate * 100).toFixed(1)}%`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  # ═══════════════════════════════════════════════════════════════
  # Job 5: Build & Package
