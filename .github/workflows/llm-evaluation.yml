name: LLM Evaluation Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      eval_framework:
        description: "Evaluation framework to use"
        required: false
        default: "both"
        type: choice
        options:
          - "deepeval"
          - "ragas"
          - "both"

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ═══════════════════════════════════════════════════════════════
  # LLM Evaluation Pipeline
  # ═══════════════════════════════════════════════════════════════
  llm-evaluation:
    name: LLM Evaluation Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine evaluation framework
        id: eval-config
        run: |
          if [ "${{ github.event.inputs.eval_framework }}" = "" ] || [ "${{ github.event.inputs.eval_framework }}" = "both" ]; then
            echo "framework=deepeval,ragas" >> $GITHUB_OUTPUT
          else
            echo "framework=${{ github.event.inputs.eval_framework }}" >> $GITHUB_OUTPUT
          fi

      - name: Run LLM Evaluation
        env:
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          USE_OPENROUTER: ${{ vars.USE_OPENROUTER || 'false' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-oss-120b:free' }}
          EVAL_MODEL: ${{ vars.EVAL_MODEL || 'openai/gpt-oss-120b:free' }}
          EVAL_THRESHOLD: ${{ vars.EVAL_THRESHOLD || '0.7' }}
          EVAL_FRAMEWORKS: ${{ steps.eval-config.outputs.framework }}
          EVAL_RUN_RAG_PIPELINE: "true"
          EVAL_CUSTOM_METRICS_ENABLED: ${{ vars.EVAL_CUSTOM_METRICS_ENABLED || 'false' }}
          EVAL_RESULTS_PATH: "artifacts/evaluation"
          DEEPEVAL_METRICS: ${{ vars.DEEPEVAL_METRICS || 'answer_relevancy,faithfulness,contextual_precision,contextual_recall' }}
          RAGAS_METRICS: ${{ vars.RAGAS_METRICS || 'faithfulness,answer_relevancy,context_precision,context_recall' }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'true' }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_SENDER_PASSWORD: ${{ secrets.EMAIL_SENDER_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          EMAIL_SMTP_HOST: ${{ vars.EMAIL_SMTP_HOST || 'smtp.gmail.com' }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT || '587' }}
        run: python -m scripts.run_evaluation

      - name: Check evaluation thresholds
        env:
          EVAL_THRESHOLD: ${{ vars.EVAL_THRESHOLD || '0.7' }}
          EVAL_RESULTS_PATH: "artifacts/evaluation"
        run: python -m scripts.check_thresholds

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: artifacts/evaluation/
